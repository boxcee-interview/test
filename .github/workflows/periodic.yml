name: crossplane-e2e

on:
  schedule:
    - cron: '0 12 * * *'
  pull_request: {}
  workflow_dispatch: {}

env:
  GO_VERSION: '1.19'
  HELM_VERSION: 'v3.9.0'
  KIND_VERSION: 'v0.16.0'

jobs:
  e2e-tests-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Crossplane Repo
        uses: actions/checkout@v2
        with:
          repository: crossplane/crossplane
          ref: master
      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Setup Kind
        uses: engineerd/setup-kind@v0.5.0
        with:
          version: ${{ env.KIND_VERSION }}
      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install Kubectl
        uses: azure/setup-kubectl@v1
      - name: Create Namespace
        run: kubectl create namespace crossplane-system
        shell: bash
      - name: Install Crossplane from Master
        run: helm repo add crossplane-master https://charts.crossplane.io/master/ && helm repo update && helm install crossplane --namespace crossplane-system crossplane-master/crossplane --devel --wait
        shell: bash
      - name: Run E2E Tests
        run: go test -p 1 -timeout 10m -v --tags=e2e ./test/e2e/...
  e2e-tests-stable:
    runs-on: ubuntu-latest
    steps:
      - name: Get Latest Crossplane Release
        id: latest-release
        run: |
          LATEST=$(gh api repos/crossplane/crossplane/releases --jq '[.[] | select(.prerelease == false)][0].tag_name')
          echo "LATEST_TAG=$LATEST" >> "$GITHUB_OUTPUT"
          echo "LATEST_VERSION=${LATEST#v}" >> "$GITHUB_OUTPUT"
          echo "LATEST_BRANCH=release-${LATEST#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout Crossplane Repo
        uses: actions/checkout@v2
        with:
          repository: crossplane/crossplane
          ref: ${{ steps.latest-release.outputs.LATEST_BRANCH }}
      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Setup Kind
        uses: engineerd/setup-kind@v0.5.0
        with:
          version: ${{ env.KIND_VERSION }}
      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install Kubectl
        uses: azure/setup-kubectl@v1
      - name: Create Namespace
        run: kubectl create namespace crossplane-system
        shell: bash
      - name: Install Crossplane from Stable
        run: helm repo add crossplane-stable https://charts.crossplane.io/stable && helm repo update && helm install crossplane --namespace crossplane-system crossplane-stable/crossplane --version ${{ steps.latest-release.outputs.LATEST_VERSION }} --wait
        shell: bash
      - name: Run E2E Tests
        run: go test -p 1 -timeout 10m -v --tags=e2e ./test/e2e/...
